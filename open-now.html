<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Now</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sky">
  <h1 class="headline">Two envelopes today</h1>
  <p class="subline">Pick one to start.</p>

  <div class="envelope-row">

    <div class="envelope-choice">
      <div class="envelope">
        <div class="envelope-body"></div>
        <div class="envelope-flap"></div>
        <!-- EDIT HERE: this leads to the rules page -->
        <a href="rules.html" class="wax-seal">Open Now</a>
      </div>
      <p class="envelope-caption">the rules of the game</p>
    </div>

    <div class="envelope-choice">
      <div class="envelope">
        <div class="envelope-body"></div>
        <div class="envelope-flap"></div>
        <!-- EDIT HERE: this leads to your "open when..." page —
             change the button text to whatever you like -->
        <a href="open-when.html" class="wax-seal">Continue</a>
      </div>
      <p class="envelope-caption">open when...</p>
    </div>

  </div>
</div>

</body>
</html>
