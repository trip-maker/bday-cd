<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open When...</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sky">
  <h1 class="headline">Open when...</h1>
  <p class="subline">Pick whichever one fits your mood right now.</p>

  <!--
    EDIT HERE:
    - Each <a> below is one category card.
    - Change the text between the <a> tags to change the label.
    - Change href="sad.html" to point to a different page.
    - To ADD a category: copy an <a>...</a> block, paste it, then
      duplicate one of the page-3 files (like sad.html) and rename
      it to match your new href.
    - To REMOVE a category: just delete its <a>...</a> block.
  -->
  <div class="card-grid">
    <a href="you're sad.html" class="card">you're sad</a>
    <a href="you need help falling asleep.html" class="card">you need help falling asleep</a>
    <a href="you are bored.html" class="card">you're bored</a>
    <a href="you need a laugh.html" class="card">you need a laugh</a>
    <a href="you need a compliment.html" class="card">when you need a compliment</a>
  </div>

  <a href="open-now.html" class="back-link">&larr; back</a>
</div>

</body>
</html>
